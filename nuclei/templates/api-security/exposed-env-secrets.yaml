id: exposed-env-secrets
info:
  name: Exposed .env Configuration & Secret Disclosure
  author: security-team
  severity: critical
  description: Detects public accessibility of .env files containing credentials, tokens, and database connection strings.
  reference:
    - https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure
  tags: env,secrets,exposure,config
  remediation: Restrict web server access to .env files and place sensitive environment configs outside the web root.

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/config/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)(?:DB_PASSWORD|DATABASE_URL|SECRET_KEY|API_KEY|JWT_SECRET)="
      - type: status
        status:
          - 200
